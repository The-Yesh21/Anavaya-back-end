<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>Chakshu AI — Mobile Companion Camera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter+Tight:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --surface: #141c2b;
            --accent-gold: #c9a227;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #app-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Top Navigation Header */
        .companion-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: linear-gradient(180deg, rgba(10, 14, 23, 0.9) 0%, rgba(10, 14, 23, 0) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(201, 162, 39, 0.15);
            border: 1px solid rgba(201, 162, 39, 0.4);
            color: var(--accent-gold);
            font-weight: 800;
            font-size: 15px;
        }
        .header-titles {
            display: flex;
            flex-direction: column;
        }
        .header-title {
            font-family: 'Inter Tight', sans-serif;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: -0.02em;
            color: #ffffff;
        }
        .header-sub {
            font-size: 11px;
            color: var(--text-muted);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.2);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }
        .status-pill.online {
            background: rgba(16, 185, 129, 0.18);
            border-color: rgba(16, 185, 129, 0.5);
            color: var(--emerald);
        }
        .status-pill.streaming {
            background: rgba(201, 162, 39, 0.18);
            border-color: rgba(201, 162, 39, 0.5);
            color: var(--accent-gold);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        /* Video Stage and Overlay */
        .stage-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }
        #mobile-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Front camera mirror by default */
        }
        #mobile-video.rear {
            transform: scaleX(1);
        }
        #mobile-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Bottom Floating Bar */
        .companion-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(0deg, rgba(10, 14, 23, 0.92) 0%, rgba(10, 14, 23, 0) 100%);
        }
        .cam-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-ctrl {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 40px;
            padding: 0 16px;
            border-radius: 20px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .btn-ctrl:active {
            transform: scale(0.96);
            background: rgba(51, 65, 85, 0.95);
        }
        .quality-tag {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.05em;
        }

        /* Error / Permission Modal */
        #permission-card {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(10, 14, 23, 0.96);
            text-align: center;
        }
        #permission-card.active {
            display: flex;
        }
        .perm-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .perm-title {
            font-family: 'Inter Tight', sans-serif;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .perm-desc {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 320px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn-grant {
            padding: 12px 28px;
            border-radius: 24px;
            background: var(--accent-gold);
            color: #000000;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app-root">
        <!-- Top Bar -->
        <header class="companion-header">
            <div class="header-brand">
                <div class="brand-badge">A</div>
                <div class="header-titles">
                    <span class="header-title">Chakshu AI</span>
                    <span class="header-sub">4K Companion Witness Feed</span>
                </div>
            </div>
            <div id="status-badge" class="status-pill">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <!-- Video & HUD Stage -->
        <main class="stage-container">
            <video id="mobile-video" autoplay playsinline muted></video>
            <canvas id="mobile-hud"></canvas>
        </main>

        <!-- Bottom Controls -->
        <footer class="companion-footer">
            <div class="cam-controls">
                <button type="button" id="flip-cam-btn" class="btn-ctrl">
                    <span>↻ Switch Camera</span>
                </button>
            </div>
            <div class="quality-tag" id="resolution-tag">1080p 60FPS</div>
        </footer>

        <!-- Permissions Card -->
        <div id="permission-card">
            <div class="perm-icon">📷</div>
            <h2 class="perm-title">Camera Permission Required</h2>
            <p class="perm-desc">Chakshu AI requires mobile camera access to stream high-definition testimony video to the courtroom trial.</p>
            <button type="button" id="grant-btn" class="btn-grant">Enable Camera</button>
        </div>
    </div>

    <script src="/face-observations.js"></script>
    <script src="/companion-cam.js"></script>
</body>
</html>
