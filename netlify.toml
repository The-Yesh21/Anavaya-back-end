# ==============================================================================
# Netlify Deployment Configuration for Anavaya
# Deploys Landing Page, Preloader, and Judicial Dashboard
# ==============================================================================

[build]
  command = "npm run build"
  publish = ".output/public"

# Route /dashboard to the Judicial Dashboard single-page application
[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/"
  to = "/dashboard/index.html"
  status = 200

# Route /courtroom and /court/* to the Virtual Courtroom interface
[[redirects]]
  from = "/courtroom"
  to = "/dashboard/courtroom.html"
  status = 200

[[redirects]]
  from = "/court/*"
  to = "/dashboard/courtroom.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
