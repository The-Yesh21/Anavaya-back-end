# ============================================================================
#  Anavaya — nginx reverse proxy (Windows)
#  Public HTTPS on :443  ->  Anavaya backend on https://127.0.0.1:8000
#
#  Installed copy: C:\nginx\conf\nginx.conf  (nginx 1.30.4, Windows build)
#  Repo copy:      deploy/nginx-anavaya.conf  (edit here, copy over)
#
#  Setup notes:
#  1. CHANGE the domain in `server_name` to your DuckDNS name.
#  2. Cert lines point at the repo's SELF-SIGNED certs so nginx runs
#     immediately for testing.  AFTER you get Let's Encrypt certs via acme.sh,
#     swap them for the LE paths shown in the comments.
#  3. Router must forward TCP 443 -> the PC's LAN IP (10.83.187.37).
#     No port-80 block: port 80 here is occupied by IIS/http.sys, and the
#     acme.sh DuckDNS flow needs no port 80.
#  4. Backend keeps running exactly as today: https on :8000 with the repo's
#     self-signed certs and --ws-ping-interval 0. nginx trusts that hop via
#     proxy_ssl_verify off (set inside the location block below).
#
#  Lifecycle (run from F:\major_project or anywhere, with -p):
#     C:/nginx/nginx.exe -p C:/nginx/ -c C:/nginx/conf/nginx.conf   # start
#     C:/nginx/nginx.exe -p C:/nginx/ -t                            # syntax test
#     C:/nginx/nginx.exe -p C:/nginx/ -s reload                     # apply edits
#     C:/nginx/nginx.exe -p C:/nginx/ -s stop                       # stop
#
#  Verified (2026-09-04): dashboard 200, /api/court/rtc-config serves,
#  /court/{id} page 200, WS /ws/court/{id} handshake -> 101 through this proxy.
# ============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Anavaya backend.  It runs HTTPS with the repo's self-signed certs;
    # nginx terminates the PUBLIC https and relays to it over TLS, skipping
    # verification of the self-signed origin cert.
    #   - If you ever run the backend as PLAIN http on :8000 instead, change
    #     the next line to http://127.0.0.1:8000 and delete the two
    #     `proxy_ssl_*` lines inside the location block.
    upstream anavaya_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;   # IPv6 — direct reach, no port-forward needed
        http2 on;
        server_name anavaya-court.duckdns.org;   # <-- CHANGE to your DuckDNS name

        # --- Bootstrap: the repo's self-signed certs (absolute paths needed) ---
        ssl_certificate     F:/major_project/case_priority_system/certs/cert.pem;
        ssl_certificate_key F:/major_project/case_priority_system/certs/key.pem;

        # --- After acme.sh issues real certs, swap to these:
        # ssl_certificate     C:/nginx/conf/anavaya.crt;
        # ssl_certificate_key C:/nginx/conf/anavaya.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        # Evidence PDFs / recordings can be large — don't hit nginx's 1 MB default
        client_max_body_size 100m;

        location / {
            proxy_pass https://anavaya_backend;

            proxy_http_version 1.1;

            # --- Courtroom WebSocket (WS /ws/court/{room_id}) ---
            # Without the Upgrade hop this connection dies instantly.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # uvicorn runs with --ws-ping-interval 0, so rooms legitimately sit
            # quiet for many minutes — keep the socket from being reaped.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Preserve the public host/scheme so the app sees the real origin
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The backend uses a SELF-SIGNED cert — trust it on this hop only
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
        }
    }
}
