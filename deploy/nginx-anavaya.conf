# ============================================================================
#  Anavaya — nginx reverse proxy (Windows)
#  Public HTTPS on :443  ->  Anavaya backend on https://127.0.0.1:8000
#
#  Setup notes:
#  1. CHANGE the domain in BOTH `server_name` lines below to your DuckDNS name.
#  2. The cert lines point at your existing SELF-SIGNED certs so nginx can run
#     immediately for testing (phones must accept the warning once — same as
#     your current LAN setup).  AFTER you get Let's Encrypt certs via acme.sh,
#     replace them with the LE paths shown in the comments.
#  3. Your router must forward TCP 443 -> the PC's LAN IP (10.83.187.37).
#     (No port 80 block here — port 80 on this machine is occupied by IIS /
#      http.sys, and the acme.sh DuckDNS flow doesn't need port 80 anyway.)
#  4. Keep the Anavaya backend running EXACTLY as you do today (https on :8000,
#     self-signed certs, --ws-ping-interval 0).  nginx skips cert verification
#     on the backend hop (proxy_ssl_verify off).
#
#  Lifecycle (run from C:\nginx in an ADMIN terminal is not required):
#     nginx            # start (keep the console window open)
#     nginx -t         # test config syntax
#     nginx -s reload  # apply config edits without restart
#     nginx -s stop    # stop
# ============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Anavaya backend address.  It runs HTTPS with the repo's self-signed
    # certs; nginx terminates the PUBLIC https and relays to it over TLS,
    # skipping verification of the self-signed origin cert.
    #   - If you ever run the backend as PLAIN http on :8000 instead, change
    #     the next line to http://127.0.0.1:8000 and delete the two
    #     `proxy_ssl_*` lines below (inside the location block).
    upstream anavaya_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;   # IPv6 — direct reach, no port-forward needed
        http2 on;
        server_name anavaya-court.duckdns.org;   # <-- CHANGE to your DuckDNS name

        # --- Bootstrap: your existing self-signed certs (C:\major_project\...)
        ssl_certificate     F:/major_project/case_priority_system/certs/cert.pem;
        ssl_certificate_key F:/major_project/case_priority_system/certs/key.pem;

        # --- After acme.sh issues real certs, swap to these and delete the two
        #     self-signed lines above:
        # ssl_certificate     C:/nginx/conf/anavaya.crt;
        # ssl_certificate_key C:/nginx/conf/anavaya.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        # Evidence PDFs / recordings can be large — don't hit nginx's 1 MB default
        client_max_body_size 100m;

        location / {
            proxy_pass https://anavaya_backend;

            proxy_http_version 1.1;

            # --- Courtroom WebSocket (WS /ws/court/{room_id}) ---
            # Without the Upgrade hop this connection dies instantly.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # uvicorn runs with --ws-ping-interval 0, so rooms legitimately sit
            # quiet for many minutes — keep the socket from being reaped.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Preserve the public host/scheme so the app sees the real origin
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The backend uses a SELF-SIGNED cert — trust it on this hop only
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
        }
    }

    # Plain-HTTP twin on localhost:8081, for outbound tunnels (ngrok,
    # localhost.run, …).  The tunnel edge terminates the PUBLIC https and
    # forwards plain http here, so it proxies to the backend over TLS like the
    # 443 listener above.  Bound to loopback only — never expose this port.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        client_max_body_size 100m;

        location / {
            proxy_pass https://anavaya_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
        }
    }

    # Same trick for the LANDING PAGE dev server (vite on https://127.0.0.1:8080).
    # Second localhost.run tunnel lands here; bound to loopback only.
    upstream landing_page {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:8082;
        server_name localhost;
        client_max_body_size 20m;

        location / {
            proxy_pass https://landing_page;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
        }
    }

    # Landing-page dev instance with VITE_BASE=/landing/ (the remote single-URL
    # mode) — vite must be started with VITE_BASE=/landing/ on port 8084.
    upstream landing_page_base {
        server 127.0.0.1:8084;
        keepalive 16;
    }

    # Combined listener: ONE public tunnel URL serves the whole flow —
    #   /          -> dashboard + courtroom (FastAPI)
    #   /landing/  -> landing page (vite, base /landing/)
    # This is what the stable ngrok dev domain points at.
    server {
        listen 127.0.0.1:8083;
        server_name localhost;
        client_max_body_size 100m;

        location = /landing {
            return 301 /landing/;
        }

        location /landing/ {
            proxy_pass https://landing_page_base;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
        }

        location / {
            proxy_pass https://anavaya_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
        }
    }
}
